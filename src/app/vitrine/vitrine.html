<div class="row p-2 d-flex justify-content-center w-100">
    <div class="card card-black col-md-4 col-8 m-1" *ngFor="let game of lista">
        <div class="pointer mb-3" (click)="showDetail(game)">
            <img src="{{game.id}}.webp" alt="game-img" class="card-img-top">
        </div>
        <div class="card-body d-flex flex-column">
            <h5 class="card-title fs-6">{{game.getTitle()}}</h5>
            <div id="price-container" class="mb-5">
                <div class="d-flex flex-row gap-3" *ngIf="game.onSale(); else justPrice">
                    <h6 class="card-subtitle mb-2 fs-6 text-decoration-underline">{{game.getPrice()}}</h6>
                    <h6 class="card-subtitle text-gray text-decoration-line-through">{{game.getFullPrice()}}</h6>
                </div>
                <ng-template #justPrice>
                    <h6 class="card-subtitle mb-2 text-decoration-underline">{{game.getPrice()}}</h6>
                </ng-template>
            </div>
            <a (click)="addToCesta(game)" class="btn btn-primary position-absolute bottom-0 end-0 m-2">Comprar</a>
        </div>
    </div>
</div>
