<header class="text-bg-gray w-100 p-3">
  <div class="row align-items-center g-3">
    
    <div id="logo-container" class="col-12 col-md-2 text-center text-md-start">
      <img src="logo.png" class="img-fluid logo-img w-50" alt="logo">
    </div>

    <div id="search-bar-container" class="col-12 col-md-8">
      <div class="input-group">
        <input (input)="catchQuery($event)" type="text" class="form-control" placeholder="Procure por algum jogo...">
        <button (click)="sendQuery()" class="btn btn-dark">Pesquisar</button>
      </div>
    </div>

    <div class="col-12 col-md-2 text-center text-md-end">
      <a id="register-container" href="" title="fazer login">
        <svg [size]="40" color="white" lucideUser></svg>
      </a>
    </div>

  </div>

  <nav class="row mt-1 g-0">
    <div class="btn-group btn-group-justified w-100">
      <a href="vitrine" class="btn btn-dark">Home</a>
      <a href="cesta" class="btn btn-dark">Cesta</a>
      <a href="cadastro" class="btn btn-dark">Cadastrar-se</a>
    </div>
  </nav>
</header>

<div>
  <router-outlet></router-outlet>
</div>

<footer class="text-bg-gray">
  <div class="p-3 text-center">
    <p class="text-center">2001-2026 Platinum. All rights reserved.</p>
    <p class="small">Este projeto foi criado estritamente para fins acadêmicos. Todos os títulos de jogos, marcas registradas e mídias associadas são propriedade da Konami Digital Entertainment.</p>
  </div>
</footer>
